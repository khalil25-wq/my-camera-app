<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة تشغيل الكاميرا</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background-color: #f0f0f0; }
        video { width: 90%; max-width: 500px; border: 5px solid #333; border-radius: 10px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>عرض بث الكاميرا داخل المتصفح</h2>
    
    <!-- زر لطلب تشغيل الكاميرا -->
    <button id="start-camera">افتح الكاميرا</button>
    
    <br>
    <!-- عنصر الفيديو الذي سيعرض بث الكاميرا -->
    <video id="video-feed" autoplay playsinline></video>

    <script>
        const startBtn = document.getElementById('start-camera');
        const videoElement = document.getElementById('video-feed');

        startBtn.addEventListener('click', async () => {
            try {
                // طلب الإذن للوصول إلى الكاميرا (الأمامية أو الخلفية في الهاتف)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, // "user" للكاميرا الأمامية، و "environment" للخلفية
                    audio: false 
                });
                
                // ربط البث المباشر بعنصر الفيديو ليظهر للمستخدم
                videoElement.srcObject = stream;
            } catch (error) {
                alert("لم يتم السماح بالوصول إلى الكاميرا أو أن متصفحك لا يدعم ذلك.");
                console.error("خطأ في الوصول للكاميرا:", error);
            }
        });
    </script>

</body>
</html>
