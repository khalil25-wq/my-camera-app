<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صائد الكرات السريعة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111, #222);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
            background: #000;
            border: 4px solid #4caf50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #basket {
            position: absolute;
            bottom: 10px;
            left: 175px;
            width: 70px;
            height: 15px;
            background: #ff9800;
            border-radius: 5px;
            box-shadow: 0 0 10px #ff9800;
        }
        .ball {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #4caf50;
            border-radius: 50%;
            box-shadow: 0 0 8px #4caf50;
        }
        #ui {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score-text">النقاط: <span id="score">0</span></div>
        <div id="lives-text">المحاولات: <span id="lives">3</span></div>
    </div>

    <div id="game-container">
        <!-- السلة التي يتحكم بها اللاعب -->
        <div id="basket"></div>

        <!-- شاشة نهاية اللعبة -->
        <div id="game-over-screen">
            <h2 style="color: #f44336; margin: 0;">انتهت اللعبة!</h2>
            <p>مجموع نقاطك: <span id="final-score">0</span></p>
            <button id="restart-btn">العب مجدداً</button>
        </div>
    </div>

<script>
    const container = document.getElementById('game-container');
    const basket = document.getElementById('basket');
    const scoreDisplay = document.getElementById('score');
    const livesDisplay = document.getElementById('lives');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    let score = 0;
    let lives = 3;
    let gameActive = true;
    let ballSpeed = 3;
    let spawnRate = 1200; // ميلي ثانية بين كل كرة وأخرى
    let gameLoopInterval, spawnInterval;

    // تحريك السلة مع حركة الفأرة أو اللمس على الهاتف
    container.addEventListener('mousemove', (e) => {
        if (!gameActive) return;
        moveBasket(e.clientX);
    });

    container.addEventListener('touchmove', (e) => {
        if (!gameActive) return;
        moveBasket(e.touches[0].clientX);
    });

    function moveBasket(clientX) {
        const rect = container.getBoundingClientRect();
        let relativeX = clientX - rect.left - (basket.offsetWidth / 2);
        
        // منع السلة من الخروج عن حدود اللعبة
        if (relativeX < 0) relativeX = 0;
        if (relativeX > container.offsetWidth - basket.offsetWidth) {
            relativeX = container.offsetWidth - basket.offsetWidth;
        }
        
        basket.style.left = relativeX + 'px';
    }

    // إنشاء كرة جديدة في مكان عشوائي بالأعلى
    function createBall() {
        if (!gameActive) return;
        const ball = document.createElement('div');
        ball.classList.add('ball');
        ball.style.top = '0px';
        ball.style.left = Math.random() * (container.offsetWidth - 20) + 'px';
        container.appendChild(ball);

        let ballY = 0;
        
        function moveBall() {
            if (!gameActive) {
                ball.remove();
                return;
            }
            ballY += ballSpeed;
            ball.style.top = ballY + 'px';

            // فحص الاصطدام بالسلة
            const basketTop = basket.offsetTop;
            const basketLeft = basket.offsetLeft;
            const basketRight = basketLeft + basket.offsetWidth;
            const ballLeft = ball.offsetLeft;
            const ballRight = ballLeft + 20;

            if (ballY >= basketTop - 20 && ballY <= basketTop + 10) {
                if (ballRight >= basketLeft && ballLeft <= basketRight) {
                    score++;
                    scoreDisplay.textContent = score;
                    ball.remove();
                    // زيادة السرعة تدريجياً لزيادة الحماس
                    if (score % 5 === 0) ballSpeed += 0.5; 
                    return;
                }
            }

            // إذا سقطت الكرة في الأسفل دون الإمساك بها
            if (ballY > container.offsetHeight) {
                lives--;
                livesDisplay.textContent = lives;
                ball.remove();
                
                if (lives <= 0) {
                    endGame();
                }
                return;
            }

            requestAnimationFrame(moveBall);
        }
        requestAnimationFrame(moveBall);
    }

    function startGame() {
        score = 0;
        lives = 3;
        ballSpeed = 3;
        gameActive = true;
        scoreDisplay.textContent = score;
        livesDisplay.textContent = lives;
        gameOverScreen.style.display = 'none';
        
        spawnInterval = setInterval(createBall, spawnRate);
    }

    function endGame() {
        gameActive = false;
        clearInterval(spawnInterval);
        finalScoreDisplay.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    restartBtn.addEventListener('click', startGame);

    // بدء اللعبة تلقائياً عند تحميل الصفحة
    startGame();
</script>

</body>
</html>
